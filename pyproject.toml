[project]
name = "raspberrygirl-voice-input"
version = "0.1.0"
description = "Raspberry Girl voice input module: capture + VAD + ASR -> waycast input frames."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "noteas", email = "3818384646@qq.com" }
]
dependencies = [
    "httpx2>=2.16,<3",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "python-dotenv>=1,<2",
    "sounddevice==0.5.6",
    "websockets==17.4",
]

[project.scripts]
voice-input = "voice_input.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_input"]
include = [
    "src/voice_input/models/campp.onnx",
    "src/voice_input/models/campp.onnx.data",
    "src/voice_input/models/gtcrn_simple.onnx",
    "src/voice_input/models/silero_vad.onnx",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
stubPath = "typings"
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
exclude = ["typings"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = []

