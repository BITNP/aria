[project]
name = "aria"
version = "0.1.0"
description = "Raspberry Girl voice input module: capture + VAD + ASR -> waycast input frames."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "noteas", email = "3818384646@qq.com" }
]
# 版本策略：语义化区间（下界=当前目标版本，上界=下一 major），可复现性由 uv.lock 保证。
dependencies = [
    "httpx2>=2.16,<3",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "python-dotenv>=1,<2",
    "sounddevice>=0.5.6,<1",
    # 17.4 是 WS 客户端回滚决定选定的目标版本（见 git revert 记录），下界守住它。
    "websockets>=17.4,<18",
]

[project.scripts]
aria = "aria.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.31,<2",
    "pytest>=8",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aria"]
include = [
    "src/aria/models/campp.onnx",
    "src/aria/models/campp.onnx.data",
    "src/aria/models/gtcrn_simple.onnx",
    "src/aria/models/silero_vad.onnx",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
stubPath = "typings"
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
exclude = ["typings"]

# lint 规则集 = ruff 内置默认（四仓一致，不另选规则族；生效规则集由 uv.lock 钉死的 ruff 版本决定）。

